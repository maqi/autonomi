[package]
name = "ant_rewards_service"
version = "0.1.0"
edition = "2021"

[dependencies]
autonomi = { git = "https://github.com/maqi/autonomi", branch = "make_get_storage_proofs_from_peer_return_PaymentQuote" }
chrono = "0.4"
clap = "4.5.28"
eyre = "0.6.12"
futures = "0.3.31"
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros", "signal"] }
xor_name = "5.0.0"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing = "0.1.41"
hex = "0.4.3"
serde = { version = "1.0.210", features = ["derive"] }
reqwest = "0.12.12"