[package]
name = "ant_rewards_service"
version = "0.1.0"
edition = "2021"

[dependencies]
autonomi = { git = "https://github.com/mickvandijke/autonomi/", rev = "3acae0da3bef367d52daa671ed145b246a1bcf3d" }
clap = "4.5.28"
eyre = "0.6.12"
futures = "0.3.31"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "signal"] }
xor_name = "5.0.0"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing = "0.1.41"
hex = "0.4.3"
